services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: PostgresPassword123
      POSTGRES_DB: mws-center
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://root:PostgresPassword123@db:5432/mws-center?schema=public}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - APP_SECRETS_KEY=${APP_SECRETS_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN}
      - CLIENT_URL=${CLIENT_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_PUBLIC_PORT=${MINIO_PUBLIC_PORT:-}
      - MINIO_PUBLIC_USE_SSL=${MINIO_PUBLIC_USE_SSL:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-mws-data-center}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PROTECTED_SUPER_ADMIN_EMAILS=${PROTECTED_SUPER_ADMIN_EMAILS:-}
      # Read by the server, so they must be listed here: a value in the stack's .env alone never reaches the container.
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-}
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
      - HUB_APPLICATION_ID=${HUB_APPLICATION_ID:-}
      - CENTRAL_API_PUBLIC_URL=${CENTRAL_API_PUBLIC_URL:-}
      - IDENTIFIER_CHANGE_APPROVER_EMAILS=${IDENTIFIER_CHANGE_APPROVER_EMAILS:-}
      - OFFICE_HOURS_START=${OFFICE_HOURS_START:-}
      - OFFICE_HOURS_END=${OFFICE_HOURS_END:-}
      - SATURDAY_DEFAULT_ACTIVE=${SATURDAY_DEFAULT_ACTIVE:-}
      - MINIO_REGION=${MINIO_REGION:-}
      # Google Workspace accounts. Only a production Central with GOOGLE_WORKSPACE_ENABLED=true talks to Google.
      - GOOGLE_WORKSPACE_ENABLED=${GOOGLE_WORKSPACE_ENABLED:-}
      - GOOGLE_WORKSPACE_CREDENTIALS_B64=${GOOGLE_WORKSPACE_CREDENTIALS_B64:-}
      - GOOGLE_WORKSPACE_ADMIN_SUBJECT=${GOOGLE_WORKSPACE_ADMIN_SUBJECT:-}
      - GOOGLE_OU_EMPLOYEE=${GOOGLE_OU_EMPLOYEE:-}
      - GOOGLE_OU_INTERN=${GOOGLE_OU_INTERN:-}
      - GOOGLE_OU_STUDENT=${GOOGLE_OU_STUDENT:-}
    ports:
      - "${SERVER_HOST_PORT:-3010}:3000"
    depends_on:
      - db
      - minio
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - path: ./client/.env
        required: false
    environment:
      - API_BASE_URL=${API_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:${CLIENT_HTTP_PORT:-5173}}
    ports:
      - "${CLIENT_HTTP_PORT:-5173}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  redisdata:
