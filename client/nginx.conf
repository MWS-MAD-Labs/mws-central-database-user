# Drop requests for unlisted hosts.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name db.mws.web.id localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Keep the combined multipart request below Cloudflare's 100 MB limit.
  client_max_body_size 95m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  location /api/ {
    set $api_upstream server:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep nginx above the backend's 120-second timeout for photo processing.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Do not rewrite signed MinIO object paths.
  location /mws-data-center/ {
    set $minio_upstream minio:9000;
    proxy_pass http://$minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
