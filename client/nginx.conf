# Any Host header other than the ones explicitly listed below (nip.io,
# raw private IP, etc.) hits this block and gets dropped with no response.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name db.mws.web.id localhost;

  root /usr/share/nginx/html;
  index index.html;

  # 50m was too tight for bulk photo upload - all files in a batch go in one
  # multipart request, so this caps the combined total, not any single file
  # (server/src/middleware/upload-body-limit.ts's bulkPhotoUploadBodyLimit
  # enforces the same ceiling app-side for a clean JSON error instead of
  # this raw nginx page).
  client_max_body_size 200m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  location /api/ {
    set $api_upstream server:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Presigned MinIO GET URLs (see server/src/lib/minio.ts, minioPresignClient) -
  # path is a straight passthrough with no rewrite, since the object path is
  # part of the signed request and must reach MinIO unchanged.
  location /mws-data-center/ {
    set $minio_upstream minio:9000;
    proxy_pass http://$minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
