# Any Host header other than the ones explicitly listed below (nip.io,
# raw private IP, etc.) hits this block and gets dropped with no response.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name db.mws.web.id localhost;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  location /api/ {
    set $api_upstream server:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
