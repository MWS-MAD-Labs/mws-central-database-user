# Any Host header other than the ones explicitly listed below (nip.io,
# raw private IP, etc.) hits this block and gets dropped with no response.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name db.mws.web.id localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Capped by Cloudflare's own Free/Pro plan limit (100MB, fixed, not
  # configurable on this plan) sitting in front of nginx - this needs to
  # stay under that or requests never even reach nginx to be measured
  # against this value; it'd just 413 straight from Cloudflare with a raw
  # HTML page instead of our own JSON error. 95m leaves headroom for
  # multipart overhead. Not any single file's limit - all files in a bulk
  # batch go in one multipart request, so this caps the combined total
  # (server/src/middleware/upload-body-limit.ts's bulkPhotoUploadBodyLimit
  # enforces the same tighter ceiling app-side, for a clean JSON error
  # instead of this raw nginx page on the rare request that does get here).
  client_max_body_size 95m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  location /api/ {
    set $api_upstream server:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Default (60s) was shorter than the backend's own idleTimeout
    # (server/src/index.ts, 120s) - a slow bulk-photo-commit batch (each
    # photo gets resized/converted server-side) could take longer than
    # that to respond, so nginx was giving up and dropping the connection
    # to the browser *before* the backend's own successful response ever
    # got a chance to reach it. Set above the backend's own timeout so
    # nginx is never the tighter constraint.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Presigned MinIO GET URLs (see server/src/lib/minio.ts, minioPresignClient) -
  # path is a straight passthrough with no rewrite, since the object path is
  # part of the signed request and must reach MinIO unchanged.
  location /mws-data-center/ {
    set $minio_upstream minio:9000;
    proxy_pass http://$minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
